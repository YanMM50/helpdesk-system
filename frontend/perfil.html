<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Perfil — Help Desk</title>
  <link rel="icon" href="img/help-desk.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <div class="sidebar-header">
      <h1><img src="img/help-desk.png" alt="" style="width:20px;height:20px;object-fit:contain;vertical-align:middle;margin-right:6px;">Help Desk</h1>
      <small>Sistema de Chamados</small>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-group-title">Menu</div>
      <a class="nav-item" data-page="dashboard" data-href="dashboard.html"><span class="icon">📊</span><span>Dashboard</span></a>
      <a class="nav-item" data-page="tickets" data-href="tickets.html"><span class="icon">🎫</span><span>Chamados</span></a>
      <a class="nav-item" data-page="new-ticket" data-href="new-ticket.html"><span class="icon">➕</span><span>Novo Chamado</span></a>
      <div class="nav-group-title">Gestão</div>
      <a class="nav-item" data-page="equipments" data-href="equipments.html"><span class="icon">🖥️</span><span>Equipamentos</span></a>
      <a class="nav-item" data-page="companies" data-href="companies.html"><span class="icon">🏢</span><span>Empresas</span></a>
      <a class="nav-item" data-admin-only data-page="users" data-href="users.html"><span class="icon">👥</span><span>Usuários</span></a>
      <a class="nav-item" data-admin-only data-page="relatorios" data-href="relatorios.html"><span class="icon">📈</span><span>Relatórios</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="avatar" id="sidebar-avatar">?</div>
        <div class="user-details">
          <div class="user-name" id="sidebar-user-name">—</div>
          <div class="user-nivel" id="sidebar-user-nivel">—</div>
        </div>
      </div>
      <button class="btn-logout" id="btn-logout">Sair</button>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <span class="topbar-title">👤 Meu Perfil</span>
      <a href="dashboard.html" class="btn btn-outline btn-sm">← Voltar</a>
    </header>

    <main class="page-body">
      <div style="max-width:600px;">

        <!-- Dados do perfil -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">Informações da Conta</span>
          </div>
          <div style="display:flex;align-items:center;gap:20px;margin-bottom:24px;">
            <div id="perfil-avatar" style="
              width:72px;height:72px;border-radius:16px;
              display:flex;align-items:center;justify-content:center;
              font-size:28px;font-weight:700;color:#fff;flex-shrink:0;
              background:#2563eb;
            ">?</div>
            <div>
              <div id="perfil-nome" style="font-size:20px;font-weight:700;">—</div>
              <div id="perfil-email" style="color:var(--text-muted);font-size:14px;margin-top:2px;">—</div>
              <div style="margin-top:6px;display:flex;gap:8px;" id="perfil-badges"></div>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
            <div>
              <label>Tipo de Conta</label>
              <div id="perfil-tipo" class="mt-1" style="font-weight:600;">—</div>
            </div>
            <div>
              <label>Nível de Suporte</label>
              <div id="perfil-nivel" class="mt-1" style="font-weight:600;">—</div>
            </div>
            <div>
              <label>Cargo</label>
              <div id="perfil-cargo" class="mt-1">—</div>
            </div>
            <div>
              <label>Membro desde</label>
              <div id="perfil-desde" class="mt-1">—</div>
            </div>
          </div>
        </div>

        <!-- Alterar senha -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">🔒 Alterar Senha</span>
          </div>
          <div id="senha-alert"></div>
          <form id="form-senha">
            <div class="form-group">
              <label for="senha-atual">Senha Atual</label>
              <input type="password" id="senha-atual" placeholder="Digite sua senha atual" required />
            </div>
            <div class="form-group">
              <label for="nova-senha">Nova Senha</label>
              <input type="password" id="nova-senha" placeholder="Mínimo 6 caracteres" required />
            </div>
            <div class="form-group">
              <label for="confirmar-senha">Confirmar Nova Senha</label>
              <input type="password" id="confirmar-senha" placeholder="Repita a nova senha" required />
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary" id="btn-salvar-senha">
                🔒 Salvar Nova Senha
              </button>
            </div>
          </form>
        </div>

      </div>
    </main>
  </div>
</div>

<div id="toast-container"></div>

<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script>
  requireAuth();
  initSidebar("perfil");

  const user = getUser();

  if (user) {
    const cor = getAvatarColor(user.nome);
    const inicial = user.nome.charAt(0).toUpperCase();

    const av = document.getElementById("perfil-avatar");
    av.textContent = inicial;
    av.style.background = cor;

    document.getElementById("perfil-nome").textContent = user.nome;
    document.getElementById("perfil-email").textContent = user.email;
    document.getElementById("perfil-cargo").textContent = user.cargo || "—";
    document.getElementById("perfil-tipo").textContent =
      user.tipo_usuario === "CLIENTE" ? "Cliente" : "Colaborador";
    document.getElementById("perfil-nivel").textContent = user.nivel_suporte;
    document.getElementById("perfil-desde").textContent =
      user.criado_em ? new Date(user.criado_em).toLocaleDateString("pt-BR") : "—";

    document.getElementById("perfil-badges").innerHTML =
      badgeNivel(user.nivel_suporte);
  }

  document.getElementById("form-senha").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("btn-salvar-senha");
    const alertEl = document.getElementById("senha-alert");
    alertEl.innerHTML = "";

    const senhaAtual = document.getElementById("senha-atual").value;
    const novaSenha = document.getElementById("nova-senha").value;
    const confirmar = document.getElementById("confirmar-senha").value;

    if (novaSenha !== confirmar) {
      alertEl.innerHTML = `<div class="alert alert-error">🚫 As senhas não coincidem.</div>`;
      return;
    }
    if (novaSenha.length < 6) {
      alertEl.innerHTML = `<div class="alert alert-error">🚫 A nova senha deve ter no mínimo 6 caracteres.</div>`;
      return;
    }

    btn.disabled = true;
    btn.textContent = "Salvando...";

    try {
      await Auth.alterarSenha(senhaAtual, novaSenha);
      alertEl.innerHTML = `<div class="alert alert-success">✅ Senha alterada com sucesso!</div>`;
      document.getElementById("form-senha").reset();
      showToast("Senha atualizada com sucesso!", "success");
    } catch (err) {
      alertEl.innerHTML = `<div class="alert alert-error">🚫 ${err.message}</div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = "🔒 Salvar Nova Senha";
    }
  });
</script>
</body>
</html>
