<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Usuários — Help Desk</title>
  <link rel="icon" href="img/help-desk.png" />
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-header"><h1><img src="img/help-desk.png" alt="" style="width:20px;height:20px;object-fit:contain;vertical-align:middle;margin-right:6px;">Help Desk</h1><small>Sistema de Chamados</small></div>
    <nav class="sidebar-nav">
      <div class="nav-group-title">Menu</div>
      <a class="nav-item" data-page="dashboard" data-href="dashboard.html"><span class="icon">📊</span><span>Dashboard</span></a>
      <a class="nav-item" data-page="tickets" data-href="tickets.html"><span class="icon">🎫</span><span>Chamados</span></a>
      <a class="nav-item" data-page="new-ticket" data-href="new-ticket.html"><span class="icon">➕</span><span>Novo Chamado</span></a>
      <div class="nav-group-title">Gestão</div>
      <a class="nav-item" data-page="equipments" data-href="equipments.html"><span class="icon">🖥️</span><span>Equipamentos</span></a>
      <a class="nav-item" data-page="companies" data-href="companies.html"><span class="icon">🏢</span><span>Empresas</span></a>
      <a class="nav-item" data-admin-only data-page="users" data-href="users.html"><span class="icon">👥</span><span>Usuários</span></a>
      <a class="nav-item" data-admin-only data-page="relatorios" data-href="relatorios.html"><span class="icon">📈</span><span>Relatórios</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="avatar" id="sidebar-avatar">?</div>
        <div class="user-details">
          <div class="user-name" id="sidebar-user-name">—</div>
          <div class="user-nivel" id="sidebar-user-nivel">—</div>
        </div>
      </div>
      <button class="btn-logout" id="btn-logout">Sair</button>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <span class="topbar-title">👥 Usuários</span>
      <button class="btn btn-primary btn-sm" id="btn-novo">➕ Novo Usuário</button>
    </header>
    <main class="page-body">
      <div class="card">
        <div id="loading" class="loading"><div class="spinner"></div> Carregando...</div>
        <div class="table-container">
          <table>
            <thead>
              <tr><th>Nome</th><th>Email</th><th>Tipo</th><th>Nível</th><th>Cargo</th><th>Status</th><th></th></tr>
            </thead>
            <tbody id="users-tbody">
              <tr><td colspan="5" class="text-center text-muted">Carregando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="modal-overlay hidden" id="modal-user">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">👤 Novo Usuário</span>
      <button class="btn-icon" onclick="closeModal('modal-user')">✕</button>
    </div>
    <div class="modal-body">
      <div id="modal-alert"></div>
      <div class="form-row">
        <div class="form-group"><label>Nome *</label><input type="text" id="u-nome" placeholder="Nome completo"/></div>
        <div class="form-group"><label>Email *</label><input type="email" id="u-email" placeholder="usuario@email.com"/></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Senha *</label><input type="password" id="u-senha" placeholder="Mínimo 6 caracteres"/></div>
        <div class="form-group">
          <label>Nível de Suporte *</label>
          <select id="u-nivel">
            <option value="N1">N1 — Suporte Básico</option>
            <option value="N2">N2 — Especializado</option>
            <option value="N3">N3 — Engenharia</option>
            <option value="ADMIN">Admin</option>
          </select>
        </div>
      </div>
      <div class="form-group"><label>Cargo</label><input type="text" id="u-cargo" placeholder="Ex: Analista de Suporte"/></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modal-user')">Cancelar</button>
      <button class="btn btn-primary" id="btn-salvar-u">Criar Usuário</button>
    </div>
  </div>
</div>

<!-- Modal Editar Usuário -->
<div class="modal-overlay hidden" id="modal-edit-user">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">✏️ Editar Usuário</span>
      <button class="btn-icon" onclick="closeModal('modal-edit-user')">✕</button>
    </div>
    <div class="modal-body">
      <div id="modal-edit-alert"></div>
      <input type="hidden" id="edit-user-id" />
      <div class="form-group">
        <label>Nome *</label>
        <input type="text" id="edit-nome" placeholder="Nome completo" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Nível de Suporte</label>
          <select id="edit-nivel">
            <option value="N1">N1 — Suporte Básico</option>
            <option value="N2">N2 — Especializado</option>
            <option value="N3">N3 — Engenharia</option>
            <option value="ADMIN">Admin</option>
          </select>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="edit-ativo">
            <option value="true">Ativo</option>
            <option value="false">Inativo</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Cargo</label>
        <input type="text" id="edit-cargo" placeholder="Ex: Analista de Suporte" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modal-edit-user')">Cancelar</button>
      <button class="btn btn-primary" id="btn-salvar-edit">Salvar Alterações</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script>
  requireAuth();
  initSidebar("users");

  const user = getUser();
  if (user?.nivel_suporte !== "ADMIN") {
    showToast("Acesso restrito a administradores.", "error");
    setTimeout(() => window.location.href = "dashboard.html", 1500);
  }

  async function load() {
    try {
      const users = await Users.list();
      const tbody = document.getElementById("users-tbody");
      tbody.innerHTML = users.map(u => `
        <tr>
          <td>
            <div class="flex" style="gap:10px;">
              <div class="avatar" style="width:32px;height:32px;font-size:13px;flex-shrink:0;">${u.nome.charAt(0)}</div>
              <strong>${u.nome}</strong>
            </div>
          </td>
          <td class="text-muted">${u.email}</td>
          <td>${u.tipo_usuario === 'CLIENTE'
            ? '<span class="badge" style="background:#e3f2fd;color:#1565c0;">Cliente</span>'
            : '<span class="badge" style="background:#e8f5e9;color:#2e7d32;">Colaborador</span>'}</td>
          <td>${u.tipo_usuario === 'CLIENTE' ? '—' : badgeNivel(u.nivel_suporte)}</td>
          <td>${u.cargo || "—"}</td>
          <td>${u.ativo ? '<span class="badge badge-resolvido">Ativo</span>' : '<span class="badge badge-fechado">Inativo</span>'}</td>
          <td style="display:flex;gap:6px;">
            <button class="btn btn-outline btn-sm" onclick="abrirEdicao(${u.id}, '${u.nome.replace(/'/g,"\\'")}', '${u.nivel_suporte}', '${u.cargo || ''}', ${u.ativo})">✏️ Editar</button>
            <button class="btn btn-sm" style="background:#fef2f2;color:#dc2626;border:1px solid #fecaca;" onclick="confirmarExclusao(${u.id}, '${u.nome.replace(/'/g,"\\'")}')">🗑️ Excluir</button>
          </td>
        </tr>`).join("");
    } catch (err) {
      showToast("Erro: " + err.message, "error");
    } finally {
      document.getElementById("loading").classList.add("hidden");
    }
  }

  window.abrirEdicao = function(id, nome, nivel, cargo, ativo) {
    document.getElementById("edit-user-id").value = id;
    document.getElementById("edit-nome").value = nome;
    document.getElementById("edit-nivel").value = nivel;
    document.getElementById("edit-cargo").value = cargo;
    document.getElementById("edit-ativo").value = String(ativo);
    document.getElementById("modal-edit-alert").innerHTML = "";
    openModal("modal-edit-user");
  };

  document.getElementById("btn-salvar-edit").addEventListener("click", async () => {
    const id = document.getElementById("edit-user-id").value;
    const nome = document.getElementById("edit-nome").value.trim();
    if (!nome) { showToast("O nome não pode estar vazio.", "error"); return; }
    try {
      await Users.update(id, {
        nome,
        nivel_suporte: document.getElementById("edit-nivel").value,
        cargo: document.getElementById("edit-cargo").value || null,
        ativo: document.getElementById("edit-ativo").value === "true",
      });
      closeModal("modal-edit-user");
      showToast("Usuário atualizado com sucesso!", "success");
      load();
    } catch (err) {
      document.getElementById("modal-edit-alert").innerHTML = `<div class="alert alert-error">${err.message}</div>`;
    }
  });

  window.confirmarExclusao = function(id, nome) {
    if (!confirm(`Deseja excluir o usuário "${nome}"?\n\nEsta ação irá desativar o acesso do usuário ao sistema.`)) return;
    Users.delete(id)
      .then(() => {
        showToast("Usuário excluído com sucesso!", "success");
        load();
      })
      .catch(err => showToast("Erro: " + err.message, "error"));
  };

  document.getElementById("btn-novo").addEventListener("click", () => openModal("modal-user"));
  document.getElementById("btn-salvar-u").addEventListener("click", async () => {
    const nome = document.getElementById("u-nome").value.trim();
    const email = document.getElementById("u-email").value.trim();
    const senha = document.getElementById("u-senha").value;
    if (!nome || !email || !senha) { showToast("Preencha todos os campos obrigatórios.", "error"); return; }
    try {
      await Users.create({
        nome,
        email,
        senha,
        nivel_suporte: document.getElementById("u-nivel").value,
        cargo: document.getElementById("u-cargo").value || null,
      });
      closeModal("modal-user");
      showToast("Usuário criado com sucesso!", "success");
      load();
    } catch (err) {
      document.getElementById("modal-alert").innerHTML = `<div class="alert alert-error">${err.message}</div>`;
    }
  });

  load();
</script>
</body>
</html>
