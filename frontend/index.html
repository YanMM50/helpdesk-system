<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Help Desk — Login</title>
  <link rel="icon" href="img/help-desk.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-logo">
      <div class="icon"><img src="img/help-desk.png" alt="Help Desk" /></div>
      <h1>Help Desk System</h1>
      <p>Gestão de Chamados Técnicos</p>
    </div>

    <div id="alert-area"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          placeholder="seu@email.com"
          required
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input
          type="password"
          id="senha"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="btn btn-primary w-100" id="btn-login" style="margin-top:8px; justify-content:center; padding:12px;">
        Entrar
      </button>
    </form>

    <p class="text-center mt-2" style="font-size:13px;">
      Não tem conta?
      <a href="cadastro.html" style="color: var(--primary);">Cadastre-se</a>
    </p>

    <p class="text-center text-muted mt-1" style="font-size:11px;">
      Sistema acadêmico de gestão de chamados técnicos.<br>
      Suporte em três níveis: N1, N2 e N3.
    </p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script>
    if (getToken()) {
      const user = getUser();
      window.location.href = user && user.tipo_usuario === "CLIENTE" ? "tickets.html" : "dashboard.html";
    }

    const form = document.getElementById("login-form");
    const alertArea = document.getElementById("alert-area");
    const btnLogin = document.getElementById("btn-login");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertArea.innerHTML = "";
      btnLogin.disabled = true;
      btnLogin.innerHTML = '<span class="spinner"></span> Entrando...';

      try {
        const email = document.getElementById("email").value;
        const senha = document.getElementById("senha").value;

        const res = await Auth.login(email, senha);

        localStorage.setItem("token", res.access_token);
        localStorage.setItem("user", JSON.stringify(res.usuario));

        // Redireciona por tipo: cliente → tickets | colaborador → dashboard
        if (res.usuario.tipo_usuario === "CLIENTE") {
          window.location.href = "tickets.html";
        } else {
          window.location.href = "dashboard.html";
        }
      } catch (err) {
        alertArea.innerHTML = `
          <div class="alert alert-error">
            🚫 ${err.message}
          </div>`;
        btnLogin.disabled = false;
        btnLogin.innerHTML = "Entrar";
      }
    });
  </script>
</body>
</html>
